approval_policy = "on-request"
approvals_reviewer = "user"
default_permissions = "my-default"

model = "gpt-6-astra"
model_reasoning_effort = "high"
service_tier = "default"

[tui.keymap.composer]
submit = "ctrl-enter"

[tui]
notifications = true
notification_method = "osc9"
notification_condition = "always"
status_line = ["model", "reasoning", "current-dir", "thread-name", "context-used", "five-hour-limit", "weekly-limit", "fast-mode", "permissions", "approval-mode", "codex-version"]
status_line_use_colors = true

[features]
tui_workspace = false

[permissions.my-default]
description = "Workspace development without command network access"
extends = ":workspace"

[permissions.my-default.network]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
http_headers_helper = "/etc/codex/github-mcp-headers"

[mcp_servers.agent-rollback]
command = "/etc/codex/agent-rollback-mcp"
